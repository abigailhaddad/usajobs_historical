name: Daily Data Update

on:
  schedule:
    # Primary run, ~2 AM EST. Deliberately at :37 and not :00 — GitHub's
    # scheduled-workflow backlog is worst on the hour, and while this was
    # '0 7 * * *' it fired 21-71 minutes late on every one of the last 15
    # scheduled runs (07:21, 07:31, 07:53, 08:09, 08:11, ...).
    - cron: '37 7 * * *'
    # Self-healing retries. Both no-op in ~10 seconds if a run has already
    # succeeded today (see the `check` job), so on a normal day these cost
    # nothing. They exist because the free shared runner pool sometimes
    # cannot allocate for hours: queue waits of 2h48m (2026-08-09) and
    # 2h36m (2026-08-05) were both followed by a manual re-run that worked.
    # This automates that re-run.
    - cron: '37 13 * * *'
    - cron: '37 19 * * *'
  workflow_dispatch:
    inputs:
      skip_collection:
        description: "Skip collection/re-poll/integrity (just re-prep + sync existing R2 data)"
        type: boolean
        default: false
      backfill_start_date:
        description: "Override historical collection start date (YYYY-MM-DD). Skips auto-detection."
        type: string
        default: ""
      backfill_end_date:
        description: "Override historical collection end date (YYYY-MM-DD). Defaults to today."
        type: string
        default: ""

# Needed for pushing changes back to repo and creating PRs.
# actions: read lets the `check` job list this workflow's earlier runs.
permissions:
  contents: write
  issues: write
  pull-requests: write
  actions: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

# Serialize with the repoll workflow: both mutate the parquet files in R2,
# so they must never write concurrently. Queue rather than cancel.
concurrency:
  group: usajobs-r2-data-write
  cancel-in-progress: false

jobs:
  # Guard for the RETRY crons only. The expensive job downloads the whole
  # dataset from R2 before it can tell whether there is anything to do, so a
  # retry decides here instead and stops if the day is already done.
  #
  # Deliberately skipped for the primary 07:37 run and for manual dispatches.
  # A separate job means a separate runner acquisition, and on 2026-08-10 this
  # job itself sat unallocated for over 15 minutes while the real work waited
  # behind `needs`. Since the first run of the day never has a prior success to
  # find, making it wait for a second runner is pure added latency on exactly
  # the path this workflow is trying to protect. Retries can afford the wait.
  #
  # This job shares the concurrency group with the real work, so a retry that
  # fires while the primary run is still going waits for it to finish and then
  # correctly sees the success — it does not race it.
  check:
    if: github.event_name == 'schedule' && github.event.schedule != '37 7 * * *'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      should_run: ${{ steps.decide.outputs.should_run }}
    steps:
    - name: Has a run already succeeded today?
      id: decide
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        GH_REPO: ${{ github.repository }}
      run: |
        TODAY=$(date -u +%F)
        SUCCESSES=$(gh run list \
          --workflow=daily-data-update.yml \
          --status=success \
          --created="$TODAY" \
          --limit 50 \
          --json databaseId --jq 'length')

        if [ "$SUCCESSES" -gt 0 ]; then
          echo "$SUCCESSES successful run(s) already today ($TODAY) — skipping."
          echo "should_run=false" >> "$GITHUB_OUTPUT"
        else
          echo "No successful run yet today ($TODAY) — proceeding."
          echo "should_run=true" >> "$GITHUB_OUTPUT"
        fi

  update-data:
    needs: check
    # `check` is skipped for the primary run and for dispatches, and a skipped
    # dependency would normally skip this job too, hence the explicit result
    # handling. Anything other than a clean "already done today" runs the work:
    # a guard that errored tells us nothing, and missing a day's data is worse
    # than a redundant run, which collection dedupes anyway.
    if: ${{ !cancelled() && (needs.check.result != 'success' || needs.check.outputs.should_run == 'true') }}
    runs-on: ubuntu-latest
    timeout-minutes: 120  # 2 hour timeout for data update
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        token: ${{ secrets.GITHUB_TOKEN }}
        fetch-depth: 0  # Need full history for git operations
        lfs: false  # Data lives in R2 now, not LFS
        ref: main  # Always start from main

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
        cache: 'pip'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Configure git
      run: |
        git config --global user.name "GitHub Actions Bot"
        git config --global user.email "actions@github.com"

    - name: Create or switch to data-updates branch
      run: |
        # Fetch all branches
        git fetch origin
        
        # Always start from main for a clean state
        git checkout main
        git pull origin main
        
        # Create a fresh data-updates branch from main
        # This ensures we always have the latest code and data
        git checkout -B data-updates
        echo "Created fresh data-updates branch from main"

    - name: Download data from R2
      env:
        R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
        R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
        R2_ENDPOINT_URL: ${{ secrets.R2_ENDPOINT_URL }}
      run: |
        pip install boto3
        python3 -c "
        import boto3, os
        s3 = boto3.client('s3',
            endpoint_url=os.environ['R2_ENDPOINT_URL'],
            aws_access_key_id=os.environ['R2_ACCESS_KEY_ID'],
            aws_secret_access_key=os.environ['R2_SECRET_ACCESS_KEY'],
        )
        os.makedirs('data', exist_ok=True)
        paginator = s3.get_paginator('list_objects_v2')
        for page in paginator.paginate(Bucket='usajobs-data', Prefix='data/'):
            for obj in page.get('Contents', []):
                key = obj['Key']
                local = key  # data/filename.parquet
                print(f'Downloading {key} ({obj[\"Size\"]/1024/1024:.1f} MB)')
                s3.download_file('usajobs-data', key, local)
        print('Done')
        "
        echo "Checking data files:"
        ls -lh data/*.parquet | head -5

    - name: Validate downloaded data from R2
      run: |
        python3 -c "
        import os, sys
        import pyarrow.parquet as pq

        data_dir = 'data'
        missing = []
        empty = []

        # Every historical year from 2013 to current year must be present
        import datetime
        current_year = datetime.date.today().year
        for year in range(2013, current_year + 1):
            path = os.path.join(data_dir, f'historical_jobs_{year}.parquet')
            if not os.path.exists(path):
                missing.append(path)
            else:
                rows = pq.read_metadata(path).num_rows
                if rows == 0:
                    empty.append(f'{path} (0 rows)')

        if missing:
            print('MISSING files after R2 download:')
            for f in missing: print(f'  {f}')
        if empty:
            print('EMPTY files after R2 download:')
            for f in empty: print(f'  {f}')
        if missing or empty:
            sys.exit(1)
        print(f'R2 download validated: all historical files present and non-empty')
        "

    # Record what every parquet looked like before collection touches it, so
    # the sync at the end can skip the ones nothing wrote. Must run after the
    # download and before update_all.py. Needs no R2 credentials.
    - name: Snapshot data baseline for changed-only sync
      run: python scripts/sync_to_r2.py --snapshot

    - name: Run daily data update
      if: inputs.skip_collection != true
      env:
        USAJOBS_API_TOKEN: ${{ secrets.USAJOBS_API_TOKEN }}
        GITHUB_ACTIONS: true
        BACKFILL_START_DATE: ${{ inputs.backfill_start_date }}
        BACKFILL_END_DATE: ${{ inputs.backfill_end_date }}
      run: |
        free -h || true
        cd update
        # -u: unbuffered. When the runner gets OOM-killed mid-step, buffered
        # progress output dies with it and the log just stops with no clue
        # which phase was running. Unbuffered output survives the kill.
        python -u update_all.py

    - name: Check for Current API warning
      if: always()
      uses: actions/github-script@v7
      with:
        script: |
          const fs = require('fs');
          const warningFile = 'logs/CURRENT_API_EMPTY_WARNING.txt';

          if (fs.existsSync(warningFile)) {
            const content = fs.readFileSync(warningFile, 'utf8');
            console.log('Warning: Current API returned 0 jobs!');

            const today = new Date().toISOString().split('T')[0];
            const runUrl = context.serverUrl + '/' + context.repo.owner + '/' + context.repo.repo + '/actions/runs/' + context.runId;

            const body = 'The USAJobs Current API returned 0 jobs during the daily update.\n\n' +
              'This may indicate:\n' +
              '- An API authentication issue\n' +
              '- An API outage\n' +
              '- A configuration problem\n\n' +
              '**Warning file contents:**\n```\n' + content + '\n```\n\n' +
              '[View the workflow run](' + runUrl + ')';

            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: 'Current API Empty - ' + today,
              body: body,
              labels: ['bug', 'api-issue'],
              assignees: ['abigailhaddad']
            });

            fs.unlinkSync(warningFile);
          }

    - name: Check for pagination under-collection
      if: always()
      uses: actions/github-script@v7
      with:
        script: |
          const fs = require('fs');
          const alertFile = 'logs/PAGINATION_UNDER_COLLECTION.txt';

          if (fs.existsSync(alertFile)) {
            const content = fs.readFileSync(alertFile, 'utf8');
            console.log('Warning: Pagination under-collection detected!');

            const today = new Date().toISOString().split('T')[0];
            const runUrl = context.serverUrl + '/' + context.repo.owner + '/' + context.repo.repo + '/actions/runs/' + context.runId;

            const body = '## Pagination Under-Collection Detected\n\n' +
              '**The API reported more total jobs than we collected.** This means the ' +
              'continuationToken-based pagination may have broken mid-run, and we silently ' +
              'missed some jobs.\n\n' +
              '**Affected date ranges:**\n```\n' + content + '\n```\n\n' +
              '**Action required:** Check whether the API changed its pagination behavior. ' +
              'The affected dates should be re-collected.\n\n' +
              '[View the workflow run](' + runUrl + ')';

            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: 'Pagination Under-Collection - ' + today,
              body: body,
              labels: ['bug', 'data-issue'],
              assignees: ['abigailhaddad']
            });

            fs.unlinkSync(alertFile);
          }

    - name: Check for historical collection failure
      if: always()
      uses: actions/github-script@v7
      with:
        script: |
          const fs = require('fs');
          const warningFile = 'logs/HISTORICAL_COLLECTION_FAILED.txt';

          if (fs.existsSync(warningFile)) {
            const content = fs.readFileSync(warningFile, 'utf8');
            console.log('Warning: Historical data collection failed!');

            const today = new Date().toISOString().split('T')[0];
            const runUrl = context.serverUrl + '/' + context.repo.owner + '/' + context.repo.repo + '/actions/runs/' + context.runId;

            const body = '## Historical Data Collection Failed\n\n' +
              content + '\n\n' +
              '**What this means:** The workflow continued and current jobs were still collected, ' +
              'but historical job data for the past ~2 weeks may be incomplete or missing.\n\n' +
              '**Likely cause:** A type/schema mismatch in a parquet column (e.g. a list value ' +
              'where a string is expected). Check the "Run daily data update" step logs.\n\n' +
              '[View the workflow run](' + runUrl + ')';

            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: 'Historical Collection Failed - ' + today,
              body: body,
              labels: ['bug', 'data-issue'],
              assignees: ['abigailhaddad']
            });

            fs.unlinkSync(warningFile);
          }

    - name: Check for pagination cap hits (500 / 10,000)
      if: always()
      uses: actions/github-script@v7
      with:
        script: |
          const fs = require('fs');
          const capFile = 'logs/CAP_HIT_WARNING.txt';

          if (fs.existsSync(capFile)) {
            const content = fs.readFileSync(capFile, 'utf8');
            console.log('Warning: a collection hit an exact pagination cap!');

            const today = new Date().toISOString().split('T')[0];
            const runUrl = context.serverUrl + '/' + context.repo.owner + '/' + context.repo.repo + '/actions/runs/' + context.runId;

            const body = '## Pagination Cap Hit (exactly 500 or 10,000)\n\n' +
              'A collection returned a count that lands *exactly* on a known page-size (500) ' +
              'or max-results (10,000) boundary. That is the classic signature of pagination ' +
              'silently stopping early — the numbers for the affected query may be truncated.\n\n' +
              '**Affected fetches:**\n```\n' + content + '\n```\n\n' +
              '**Action:** Confirm whether the real total actually equals that number (a rare ' +
              'coincidence) or whether pagination broke and the data needs re-collecting.\n\n' +
              '[View the workflow run](' + runUrl + ')';

            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: 'Pagination Cap Hit - ' + today,
              body: body,
              labels: ['bug', 'data-issue'],
              assignees: ['abigailhaddad']
            });

            fs.unlinkSync(capFile);
          }

    # NOTE: Historical status re-polling (older than the last 14 days) now runs
    # in its own workflow (.github/workflows/repoll-status.yml) so a slow/large
    # repoll can never block today's data from publishing. The daily collection
    # above already re-fetches the last 14 days with fresh statuses.

    - name: Run data integrity tests
      id: data_tests
      run: |
        cd update
        python test_data_integrity.py

    - name: Commit and push to data-updates branch
      # Only runs if tests pass
      run: |
        # Check if there are changes (exclude parquet files and workflow files)
        # Workflow files are excluded because GITHUB_TOKEN lacks workflows permission to push them
        # CHANGES_MADE means "something changed, so prep and sync" — it is true
        # for parquet-only runs too, since those still belong in R2.
        # COMMIT_PUSHED means "there is a commit on data-updates to open a PR
        # for", which is a different question. Gating PR creation on the first
        # one meant a backfill that only rewrote a parquet still tried to open a
        # PR from a branch identical to main, and GitHub answered "No commits
        # between main and data-updates" — a red run over data that was already
        # safely synced (2026-08-14, run 32041326957).
        if [ -n "$(git status --porcelain -- ':!*.parquet' ':!.github/')" ]; then
          git add -- ':!*.parquet' ':!.github/'
          git commit -m "Daily data update - $(date +'%Y-%m-%d')"
          git push -f origin data-updates
          echo "CHANGES_MADE=true" >> $GITHUB_ENV
          echo "COMMIT_PUSHED=true" >> $GITHUB_ENV
        elif [ -n "$(git status --porcelain)" ]; then
          # Parquet files changed but nothing else — still sync to R2
          echo "Only data files changed (will sync to R2, no PR needed)"
          echo "CHANGES_MADE=true" >> $GITHUB_ENV
          echo "COMMIT_PUSHED=false" >> $GITHUB_ENV
        else
          echo "No changes to commit"
          echo "CHANGES_MADE=false" >> $GITHUB_ENV
          echo "COMMIT_PUSHED=false" >> $GITHUB_ENV
        fi

    # A manual run must re-prep and sync even when no new rows arrived —
    # that is exactly what the skip_collection input promises. Gating these on
    # CHANGES_MADE alone made skip_collection a no-op: with collection skipped
    # nothing changes, so CHANGES_MADE is false and prep/sync never ran.
    - name: Prep web data
      if: env.CHANGES_MADE == 'true' || github.event_name == 'workflow_dispatch'
      env:
        USAJOBS_API_TOKEN: ${{ secrets.USAJOBS_API_TOKEN }}
      run: |
        python scripts/prep_web_data.py

    # The site has no server API any more; the browser queries the parquet
    # directly. What needs guarding is that the filter semantics in
    # web/shared/filters.js still match api/columns.py, that every filterable
    # column exists in the parquet just written, and that static.json's row
    # order still matches the table's column order.
    - name: Test web data and filter parity
      if: env.CHANGES_MADE == 'true' || github.event_name == 'workflow_dispatch'
      run: |
        pip install pytest duckdb
        python -m pytest web/tests/test_filters.py -v

    - name: Sync to R2
      if: (env.CHANGES_MADE == 'true' || github.event_name == 'workflow_dispatch') && steps.data_tests.outcome == 'success'
      env:
        R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
        R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
        R2_ENDPOINT_URL: ${{ secrets.R2_ENDPOINT_URL }}
      run: |
        python scripts/sync_to_r2.py --only-changed

    - name: Create Pull Request
      if: env.COMMIT_PUSHED == 'true'
      env:
        GH_TOKEN: ${{ secrets.PAT_TOKEN }}
      run: |
        # Every call here can come back 503 — GitHub threw them at everything on
        # 2026-08-17. Untreated, a 503 on the lookup reads as "no PR exists" and
        # a 503 on the create fails the step, both AFTER the data has already
        # synced to R2, so the run goes red over a repo-side bookkeeping call.
        LOOKUP_OK=false
        for attempt in 1 2 3 4 5; do
          if PR_EXISTS=$(gh pr list --base main --head data-updates --state open --json number --jq length 2>&1); then
            LOOKUP_OK=true
            break
          fi
          echo "  PR lookup failed (attempt $attempt/5): $PR_EXISTS"
          sleep $((attempt * 10))
        done

        if [ "$LOOKUP_OK" != "true" ]; then
          echo "::error::Could not reach GitHub to check for an existing PR after 5 attempts"
          exit 1
        fi

        if [ "$PR_EXISTS" -eq "0" ]; then
          echo "Creating new PR..."
          for attempt in 1 2 3 4 5; do
            if gh pr create \
                 --base main \
                 --head data-updates \
                 --title "Daily data update - $(date +'%Y-%m-%d')" \
                 --body "Automated daily data update from USAJobs API"; then
              exit 0
            fi
            # It may have been created despite the error response.
            if [ "$(gh pr list --base main --head data-updates --state open --json number --jq length 2>/dev/null)" = "1" ]; then
              echo "PR exists despite the API error — continuing"
              exit 0
            fi
            echo "  PR create failed (attempt $attempt/5) — retrying in $((attempt * 15))s"
            sleep $((attempt * 15))
          done
          echo "::error::Could not create the data-updates PR after 5 attempts"
          exit 1
        else
          echo "PR already exists, skipping creation"
        fi

    - name: Auto-merge PR if tests pass
      if: env.CHANGES_MADE == 'true' && steps.data_tests.outcome == 'success'
      run: |
        # Wait a moment for PR to be created
        sleep 10

        # Find the PR number. Separate "GitHub would not answer" from "there is
        # no PR" — the old single call conflated them, so a 503 here silently
        # skipped the merge and passed the step.
        LOOKUP_OK=false
        for attempt in 1 2 3 4 5; do
          if PR_NUMBER=$(gh pr list --base main --head data-updates --json number --jq '.[0].number' 2>&1); then
            LOOKUP_OK=true
            break
          fi
          echo "  PR lookup failed (attempt $attempt/5): $PR_NUMBER"
          sleep $((attempt * 10))
        done

        if [ "$LOOKUP_OK" != "true" ]; then
          echo "::error::Could not reach GitHub to look up the data-updates PR after 5 attempts"
          exit 1
        fi

        if [ -z "$PR_NUMBER" ]; then
          echo "No open data-updates PR — nothing to merge"
          exit 0
        fi

        # Retry the merge itself. On 2026-08-17 a single 503 here failed a run
        # whose data had already collected, tested and synced — and the retry
        # workflow then re-ran the whole ~15 minute job to redo a 5 second call.
        echo "Auto-merging PR #$PR_NUMBER"
        for attempt in 1 2 3 4 5; do
          if gh pr merge "$PR_NUMBER" --merge --auto; then
            echo "Merge requested for PR #$PR_NUMBER"
            exit 0
          fi
          # It may have gone through despite the error response.
          PR_STATE=$(gh pr view "$PR_NUMBER" --json state --jq '.state' 2>/dev/null || echo UNKNOWN)
          if [ "$PR_STATE" = "MERGED" ]; then
            echo "PR #$PR_NUMBER is already merged despite the API error — continuing"
            exit 0
          fi
          echo "  merge attempt $attempt/5 failed (state: $PR_STATE) — retrying in $((attempt * 15))s"
          sleep $((attempt * 15))
        done

        echo "::error::PR #$PR_NUMBER could not be merged after 5 attempts"
        exit 1
      env:
        GH_TOKEN: ${{ secrets.PAT_TOKEN }}

    - name: Check for failures
      if: failure() || (env.CHANGES_MADE == 'true' && steps.data_tests.outcome == 'failure')
      uses: actions/github-script@v7
      with:
        script: |
          const title = `Daily Data Update Failed - ${new Date().toISOString().split('T')[0]}`;

          // There are three scheduled attempts a day now, so a failure that
          // persists across all of them would otherwise open three identical
          // issues. Comment on today's issue instead of opening another.
          const existing = await github.rest.issues.listForRepo({
            owner: context.repo.owner,
            repo: context.repo.repo,
            state: 'open',
            labels: 'automated',
            per_page: 100
          });
          const dupe = existing.data.find(i => i.title === title);

          const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
          // context.job is the job NAME ("update-data"), not an object, so
          // context.job.status was always undefined and this always chose the
          // "Tests failed" branch. Issue #547 therefore read "Tests failed but
          // a PR was created" directly above "Data Integrity Tests: success",
          // when what actually happened was a failing PR-creation step.
          const jobStatus = '${{ job.status }}';
          const detail = `${jobStatus === 'failure' ? 'The workflow failed to complete.' : 'Tests failed but a PR was created.'}

            Test Results:
            - Data Integrity Tests: ${{ steps.data_tests.outcome }}

            [View the workflow run](${runUrl})`;

          if (dupe) {
            console.log(`Issue #${dupe.number} already open for today — commenting instead.`);
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: dupe.number,
              body: `Another attempt failed today.\n\n${detail}`
            });
          } else {
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: title,
              body: `The daily data update workflow had issues.\n\n${detail}\n\n            Please check the logs for details.`,
              labels: ['bug', 'automated'],
              assignees: ['abigailhaddad']
            });
          }