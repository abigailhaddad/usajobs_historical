name: Notify on Pipeline Failure

# Safety net for the data pipelines. This runs as a SEPARATE workflow on a
# fresh runner AFTER the watched workflow finishes, so it fires even when the
# original run's runner is killed mid-job (OOM / "lost communication") — the
# exact failure mode the in-job "Check for failures" step cannot catch,
# because that step dies along with the runner.

on:
  workflow_run:
    workflows:
      - "Daily Data Update"
      - "Repoll Historical Status"
    types:
      - completed

permissions:
  issues: write
  actions: write

jobs:
  # A Daily Data Update retry (the 13:37 and 19:37 UTC crons) that dies in its
  # 5-minute `check` job before any work starts, on a day that already has a
  # successful run, is not a data problem: nothing was missed. On 2026-11-11 the
  # 19:37 retry's `check` job got no working runner, the run was marked failed,
  # the rerun was refused ("This workflow run cannot be retried") and issue #741
  # got a comment, while the day's data had updated fine at 16:09 UTC. This job
  # marks only that case; any failure where `update-data` ran still alerts.
  # Fail-open: if this job breaks, its output is empty and the jobs below run
  # exactly as before.
  triage:
    if: github.event.workflow_run.conclusion == 'failure' || github.event.workflow_run.conclusion == 'cancelled'
    runs-on: ubuntu-latest
    outputs:
      already_done: ${{ steps.decide.outputs.already_done }}
    steps:
      - name: Was this an empty retry on a day that already succeeded?
        id: decide
        uses: actions/github-script@v7
        with:
          script: |
            const run = context.payload.workflow_run;
            let done = false;
            if (run.name === 'Daily Data Update') {
              const jobs = await github.paginate(github.rest.actions.listJobsForWorkflowRunAttempt, {
                owner: context.repo.owner, repo: context.repo.repo,
                run_id: run.id, attempt_number: run.run_attempt, per_page: 100,
              });
              const workRan = jobs.some(j => j.name === 'update-data' && j.conclusion && j.conclusion !== 'skipped');
              if (!workRan) {
                const day = run.created_at.slice(0, 10);
                const ok = (await github.paginate(github.rest.actions.listWorkflowRuns, {
                  owner: context.repo.owner, repo: context.repo.repo, workflow_id: run.workflow_id,
                  status: 'success', created: day, per_page: 100,
                })).filter(r => r.id !== run.id);
                if (ok.length) {
                  done = true;
                  console.log(`update-data never ran in run ${run.id}, and ${ok.length} run(s) already succeeded on ${day} ` +
                              `(e.g. ${ok[0].html_url}). No rerun, no alert.`);
                }
              }
            }
            core.setOutput('already_done', done ? 'true' : 'false');

  retry:
    # First failure of a run gets ONE automatic rerun. Runner deaths
    # ("shutdown signal", OOM, lost communication) are transient and a plain
    # rerun recovers them; a genuine bug just fails again on attempt 2 and
    # the notify job below opens the issue. run_attempt == 1 is the loop
    # guard: attempt 2's failure never triggers another rerun.
    needs: triage
    if: always() && github.event.workflow_run.conclusion == 'failure' && github.event.workflow_run.run_attempt == 1 && needs.triage.outputs.already_done != 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Rerun the failed jobs (one retry)
        uses: actions/github-script@v7
        with:
          script: |
            const run = context.payload.workflow_run;
            try {
              await github.rest.actions.reRunWorkflowFailedJobs({
                owner: context.repo.owner,
                repo: context.repo.repo,
                run_id: run.id,
              });
              console.log(`Requested rerun of failed jobs for "${run.name}" run ${run.id} (attempt 1 -> 2).`);
            } catch (e) {
              // If the rerun can't be started, don't fail silently — open the
              // issue now instead of waiting for an attempt 2 that won't come.
              console.log(`Rerun request failed: ${e.message} — opening issue instead.`);
              const date = new Date().toISOString().split('T')[0];
              const title = `${run.name} Failed - ${date}`;

              // Dedup exactly as the notify job does. When the runner survives
              // its failure, the watched workflow's own "Check for failures"
              // step has already opened this issue under this title, and this
              // path opens a second one seconds later — which is what happened
              // on 2026-08-17 (#542 and #543, one event).
              const existing = await github.paginate(github.rest.issues.listForRepo, {
                owner: context.repo.owner,
                repo: context.repo.repo,
                state: 'open',
                per_page: 100,
              });
              const dupe = existing.find(i => i.title === title);

              if (dupe) {
                console.log(`Issue #${dupe.number} already open for "${title}" — commenting instead.`);
                await github.rest.issues.createComment({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  issue_number: dupe.number,
                  body: `The automatic rerun could not be started either (${e.message}), so this run will not retry itself.\n\n[View the failed run](${run.html_url})`,
                });
              } else {
                await github.rest.issues.create({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  title,
                  body: `**${run.name}** failed and the automatic rerun could not be started (${e.message}).\n\n[View the failed run](${run.html_url})`,
                  labels: ['bug', 'automated', 'pipeline-failure'],
                  assignees: ['abigailhaddad'],
                });
              }
            }

  notify:
    # Fires once the automatic retry has also gone wrong (attempt >= 2).
    # Attempt 1 failures are handled by the retry job above.
    #
    # `cancelled` counts here even though it is ignored on attempt 1, where it
    # usually means a human stopped the run. On attempt 2 nobody asked for the
    # run at all — it is a retry we started — so a cancellation is the retry
    # dying, not a person changing their mind. Alerting only on 'failure' would
    # trade attempt 1's alert for silence in that case, and cancellations are
    # not rare here: 3 of the last 6 non-success daily runs ended cancelled.
    # Kept on one line on purpose: a folded `if:` still evaluates, but a broken
    # condition here fails silently (no alert, no error), so this stays boring.
    needs: triage
    if: always() && (github.event.workflow_run.conclusion == 'failure' || github.event.workflow_run.conclusion == 'cancelled') && github.event.workflow_run.run_attempt >= 2 && needs.triage.outputs.already_done != 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Open an issue for the failed run
        uses: actions/github-script@v7
        with:
          script: |
            const run = context.payload.workflow_run;
            const date = new Date().toISOString().split('T')[0];
            // Matches the in-job "Check for failures" handler's title exactly
            // (e.g. "Daily Data Update Failed - 2026-07-24") so that if the
            // runner survived and that handler already opened an issue, we
            // dedup against it and don't post a second one.
            const title = `${run.name} Failed - ${date}`;

            const existing = await github.paginate(github.rest.issues.listForRepo, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              per_page: 100,
            });
            if (existing.some(i => i.title === title)) {
              console.log(`Open issue already exists for "${title}" — skipping.`);
              return;
            }

            // Attempt >= 2 means the original run failed and the automatic
            // retry then failed or was cancelled. Say which, because they
            // point at different things: a second failure suggests a real
            // bug, a cancelled retry suggests the runner never got going.
            const lead = run.conclusion === 'cancelled'
              ? [`**${run.name}** failed, and the automatic retry was cancelled`,
                 `rather than completing. Nobody requested this attempt, so the`,
                 `cancellation is the retry dying — not a human stopping it.`,
                 `The original failure is still unaddressed.`]
              : [`**${run.name}** run failed twice: the original run and the`,
                 `automatic retry. This is unlikely to be a transient runner`,
                 `death — check the logs.`];

            const body = [
              ...lead,
              ``,
              ``,
              `This alert comes from a separate watcher workflow, so it fires even`,
              `when the runner is killed mid-run (OOM / lost communication) and the`,
              `in-job failure handler never gets to execute.`,
              ``,
              `- Conclusion: \`${run.conclusion}\``,
              `- Attempt: ${run.run_attempt}`,
              `- Triggered by: ${run.event}`,
              `- Head branch: \`${run.head_branch}\``,
              ``,
              `[View the failed run](${run.html_url})`,
              ``,
              `Note: if the runner died, that run's own logs may be unavailable.`,
              `Check an earlier attempt's logs (\`?/attempts/1\`) for the last output.`,
            ].join('\n');

            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title,
              body,
              labels: ['bug', 'automated', 'pipeline-failure'],
              assignees: ['abigailhaddad'],
            });
            console.log(`Opened issue: ${title}`);
