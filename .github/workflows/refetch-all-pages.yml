name: Re-fetch All Announcement Pages

# Nightly until done: re-fetches every announcement page on the dataset, a few
# month files a night, and gives each row the current parser's section text.
# Undoes what the parser before #668 did to stored text that cannot be fixed
# from the text itself -- words split in two at tags ("Fi nancial"), agency
# links to the help site deleted, spaces before punctuation. See
# scripts/refetch_all_pages.py.
#
# Progress is the dataset's own commit history: a month is done when it has a
# "Re-fetch every announcement page in ..." commit. Once every month has one,
# a run finds nothing to do and exits in a minute; delete this workflow then.
#
# 00:17 UTC with a 5-hour budget, so it is finished well before the daily
# update at 07:37, which shares its concurrency group.

on:
  schedule:
    - cron: '17 0 * * *'
  workflow_dispatch:
    inputs:
      hours:
        description: "Stop starting new months after this many hours"
        type: string
        default: "5"
      months:
        description: "Only these months (YYYY-MM, space-separated). Empty: the next undone, newest first."
        type: string
        default: ""
      dry_run:
        description: "Fetch and report, write nothing"
        type: boolean
        default: false

permissions:
  contents: read
  issues: write

concurrency:
  group: usajobs-r2-data-write
  cancel-in-progress: false

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  refetch:
    runs-on: ubuntu-latest
    timeout-minutes: 345
    steps:
    - uses: actions/checkout@v4
      with:
        lfs: false

    - uses: actions/setup-python@v5
      with:
        python-version: '3.11'
        cache: 'pip'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install boto3 pytest huggingface_hub

    - name: Test the parser and the re-fetch
      run: python -m pytest scripts/tests/test_refetch_all_pages.py scripts/tests/test_refetch_leftover_rows.py scripts/tests/test_scrape_parse.py -q

    - name: Download scraped files from R2
      env:
        R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
        R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
        R2_ENDPOINT_URL: ${{ secrets.R2_ENDPOINT_URL }}
      run: |
        python3 -c "
        import boto3, os
        s3 = boto3.client('s3',
            endpoint_url=os.environ['R2_ENDPOINT_URL'],
            aws_access_key_id=os.environ['R2_ACCESS_KEY_ID'],
            aws_secret_access_key=os.environ['R2_SECRET_ACCESS_KEY'])
        os.makedirs('data', exist_ok=True)
        for page in s3.get_paginator('list_objects_v2').paginate(
                Bucket='usajobs-data', Prefix='data/scraped_jobs_'):
            for obj in page.get('Contents', []):
                key = obj['Key']
                if 'backup' in key or not key.endswith('.parquet'):
                    continue
                print(f'Downloading {key} ({obj[\"Size\"]/1024/1024:.1f} MB)')
                s3.download_file('usajobs-data', key, key)
        "
        python scripts/sync_to_r2.py --snapshot

    - name: Re-fetch the next months
      env:
        HF_TOKEN: ${{ secrets.HF_TOKEN }}
        HOURS: ${{ inputs.hours || '5' }}
        MONTHS: ${{ inputs.months }}
        DRY_RUN: ${{ inputs.dry_run && '--dry-run' || '' }}
      run: |
        python -u scripts/refetch_all_pages.py --hours "$HOURS" \
          ${MONTHS:+--months $MONTHS} \
          --scraped data/scraped_jobs_*.parquet \
          --report refetch_all_pages.csv $DRY_RUN

    - name: Keep the list of pages that did not come back
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: refetch-all-pages
        path: refetch_all_pages.csv
        if-no-files-found: ignore
        retention-days: 90

    # Even when the step above failed part way: months it committed to the
    # dataset have their scraped rows changed on disk, and those must reach R2
    # or a rebuild of the month would bring the old text back.
    - name: Upload changed scraped files to R2
      if: always() && !inputs.dry_run
      env:
        R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
        R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
        R2_ENDPOINT_URL: ${{ secrets.R2_ENDPOINT_URL }}
      run: python scripts/sync_to_r2.py --only-changed

    - name: Open an issue if the run failed
      if: failure()
      uses: actions/github-script@v7
      with:
        script: |
          const runUrl = context.serverUrl + '/' + context.repo.owner + '/' +
                         context.repo.repo + '/actions/runs/' + context.runId;
          const today = new Date().toISOString().split('T')[0];
          await github.rest.issues.create({
            owner: context.repo.owner, repo: context.repo.repo,
            title: 'Nightly page re-fetch failed - ' + today,
            body: 'The nightly re-fetch of announcement pages failed. It stops ' +
                  'without committing a month when fewer than 95% of its pages ' +
                  'come back or too many rows would lose their qualifications, ' +
                  'so the dataset is unchanged for that month; tomorrow\'s run ' +
                  'tries it again. Check the log for which.\n\n[View the run](' +
                  runUrl + ')',
            labels: ['data-issue'],
            assignees: ['abigailhaddad'],
          });
