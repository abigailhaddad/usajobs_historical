name: Re-fetch Leftover Section Rows

# One-off, manual. Follows repair-section-leaks.yml: the rows whose run-on
# that repair could not cut exactly are fetched again from usajobs.gov and
# given the current parser's section text. See
# scripts/refetch_leftover_rows.py.
#
# Run it once without `apply` and read refetch_leftovers.csv (uploaded as an
# artifact: old and new text side by side, with links), then with `apply`.

on:
  workflow_dispatch:
    inputs:
      apply:
        description: "Write the re-fetched text. Unticked, it only reports."
        type: boolean
        default: false

permissions:
  contents: read

# Same group as the daily update, which also writes the scraped files in R2
# and publishes to the dataset. Queue rather than cancel.
concurrency:
  group: usajobs-r2-data-write
  cancel-in-progress: false

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  refetch:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
    - uses: actions/checkout@v4
      with:
        lfs: false

    - uses: actions/setup-python@v5
      with:
        python-version: '3.11'
        cache: 'pip'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install boto3 pytest huggingface_hub

    - name: Test the re-fetch and the parser it uses
      run: python -m pytest scripts/tests/test_refetch_leftover_rows.py scripts/tests/test_repair_section_leaks.py scripts/tests/test_scrape_parse.py -q

    - name: Download scraped files from R2
      env:
        R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
        R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
        R2_ENDPOINT_URL: ${{ secrets.R2_ENDPOINT_URL }}
      run: |
        python3 -c "
        import boto3, os
        s3 = boto3.client('s3',
            endpoint_url=os.environ['R2_ENDPOINT_URL'],
            aws_access_key_id=os.environ['R2_ACCESS_KEY_ID'],
            aws_secret_access_key=os.environ['R2_SECRET_ACCESS_KEY'])
        os.makedirs('data', exist_ok=True)
        for page in s3.get_paginator('list_objects_v2').paginate(
                Bucket='usajobs-data', Prefix='data/scraped_jobs_'):
            for obj in page.get('Contents', []):
                key = obj['Key']
                if 'backup' in key or not key.endswith('.parquet'):
                    continue
                print(f'Downloading {key} ({obj[\"Size\"]/1024/1024:.1f} MB)')
                s3.download_file('usajobs-data', key, key)
        "
        python scripts/sync_to_r2.py --snapshot

    - name: Re-fetch the leftover rows
      env:
        HF_TOKEN: ${{ secrets.HF_TOKEN }}
        DRY_RUN: ${{ !inputs.apply && '--dry-run' || '' }}
      run: |
        python scripts/refetch_leftover_rows.py --all \
          --scraped data/scraped_jobs_*.parquet \
          --report refetch_leftovers.csv $DRY_RUN

    - name: Keep the report
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: refetch-leftovers
        path: refetch_leftovers.csv
        if-no-files-found: ignore

    - name: Upload changed scraped files to R2
      if: inputs.apply
      env:
        R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
        R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
        R2_ENDPOINT_URL: ${{ secrets.R2_ENDPOINT_URL }}
      run: python scripts/sync_to_r2.py --only-changed
