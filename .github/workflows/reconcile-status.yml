name: Reconcile Status

# One-off, manual. Asks the Historical API about every open date that still
# holds a non-final row and reports where our status differs. The repoll does
# this a year at a time and skips the last 14 days; this does it all at once.
# Reports only unless `apply` is ticked. See scripts/reconcile_status.py.
#
# Run it once without `apply`, read the summary and the status-reconcile
# artifact, then run it again with `apply`. Applying uploads only the year
# files it changed, and keeps the untouched originals as an artifact for 14
# days. Corrections reach the Hugging Face dataset on its next monthly
# --refresh-all.

on:
  workflow_dispatch:
    inputs:
      years:
        description: "Years to check (space-separated)."
        type: string
        default: "2025 2026"
      apply:
        description: "Write the corrections to R2. Unticked, it only reports."
        type: boolean
        default: false

permissions:
  contents: read

# Same group as the daily update and the repoll: all three rewrite the year
# files in R2, so they must never run together. Queue rather than cancel.
concurrency:
  group: usajobs-r2-data-write
  cancel-in-progress: false

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  reconcile:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    steps:
    - uses: actions/checkout@v4
      with:
        lfs: false

    - uses: actions/setup-python@v5
      with:
        python-version: '3.11'
        cache: 'pip'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install boto3 pytest

    - name: Download historical files from R2
      env:
        R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
        R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
        R2_ENDPOINT_URL: ${{ secrets.R2_ENDPOINT_URL }}
      run: |
        python3 -c "
        import boto3, os
        s3 = boto3.client('s3',
            endpoint_url=os.environ['R2_ENDPOINT_URL'],
            aws_access_key_id=os.environ['R2_ACCESS_KEY_ID'],
            aws_secret_access_key=os.environ['R2_SECRET_ACCESS_KEY'])
        os.makedirs('data', exist_ok=True)
        for page in s3.get_paginator('list_objects_v2').paginate(
                Bucket='usajobs-data', Prefix='data/historical_jobs_'):
            for obj in page.get('Contents', []):
                key = obj['Key']
                if 'backup' in key:
                    continue
                print(f'Downloading {key} ({obj[\"Size\"]/1024/1024:.1f} MB)')
                s3.download_file('usajobs-data', key, key)
        "

    - name: Test the reconcile logic
      run: python -m pytest scripts/tests/test_reconcile_status.py -q

    - name: Keep the originals
      if: inputs.apply
      env:
        YEARS: ${{ inputs.years }}
      run: |
        mkdir -p originals
        for y in $YEARS; do cp "data/historical_jobs_$y.parquet" originals/; done
        python scripts/sync_to_r2.py --snapshot

    - name: Back up the originals
      if: inputs.apply
      uses: actions/upload-artifact@v4
      with:
        name: status-reconcile-originals
        path: originals/
        retention-days: 14

    - name: Reconcile statuses
      env:
        YEARS: ${{ inputs.years }}
        APPLY: ${{ inputs.apply && '--apply' || '' }}
      run: python scripts/reconcile_status.py --years $YEARS $APPLY

    - name: Sync changed files to R2
      if: inputs.apply
      env:
        R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
        R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
        R2_ENDPOINT_URL: ${{ secrets.R2_ENDPOINT_URL }}
      run: python scripts/sync_to_r2.py --only-changed

    - name: Keep the reports
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: status-reconcile
        path: logs/status_*.csv
        if-no-files-found: ignore
        retention-days: 90
